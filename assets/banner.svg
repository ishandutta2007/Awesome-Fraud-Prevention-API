<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e293b">
        <animate attributeName="stop-color" values="#1e293b;#0f172a;#1e293b" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284c7">
        <animate attributeName="stop-color" values="#0284c7;#0369a1;#0284c7" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dynamic Animated Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg)" />

  <!-- Shield Icon Graphic -->
  <g transform="translate(140, 60)" filter="url(#glow)">
    <path d="M 90 10 L 160 40 V 100 C 160 145 90 180 90 180 C 90 180 20 145 20 100 V 40 Z" fill="url(#shieldGrad)" opacity="0.9">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M 70 95 L 85 110 L 115 75" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Animated Pulse Line -->
  <path d="M 0 150 Q 200 150 320 150 T 400 120 T 430 180 T 460 90 T 490 200 T 520 150 T 1200 150" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.4">
    <animate attributeName="stroke-dashoffset" values="1000;0" dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Typography -->
  <text x="350" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="1">
    Awesome Fraud Prevention API
  </text>

  <text x="350" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
    🛡️ Curated APIs, Open-Source Tools &amp; Enterprise Platforms for Fraud &amp; Risk Detection
  </text>

  <!-- Animated Pulsing Status Dot & Text -->
  <g transform="translate(350, 215)">
    <rect x="0" y="0" width="340" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="17" r="6" fill="#10b981">
      <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">
      Real-Time Monitoring • Risk Scoring • Open Source
    </text>
  </g>
</svg>
